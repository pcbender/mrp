{% extends "_base.html" %}
{% block page_title %} — Catalog{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">Catalog <small>{{ tracks|length }} of {{ total }} tracks</small></h1>
</div>

<div class="filters">
  <div class="filter-group">
    <label>Search</label>
    <input
      type="text"
      name="q"
      value="{{ q }}"
      placeholder="Track, artist, or release…"
      class="input-wide"
      hx-get="/catalog"
      hx-trigger="input changed delay:300ms"
      hx-target="#catalog-table"
      hx-swap="innerHTML"
      hx-include="[name='artist_filter'],[name='sort'],[name='dir']">
  </div>
  <div class="filter-group">
    <label>Artist</label>
    <select
      name="artist_filter"
      hx-get="/catalog"
      hx-trigger="change"
      hx-target="#catalog-table"
      hx-swap="innerHTML"
      hx-include="[name='q'],[name='sort'],[name='dir']">
      <option value="">All artists</option>
      {% for a in artists %}
      <option value="{{ a.id }}" {% if a.id == artist_filter %}selected{% endif %}>{{ a.name }}</option>
      {% endfor %}
    </select>
  </div>
</div>

<div id="catalog-table" class="table-wrap">
  {% include "catalog/_table_body.html" %}
</div>
{% endblock %}
