{% extends "_base.html" %}
{% block page_title %} — Catalog{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">Catalog <small>{{ tracks|length }} of {{ total }} tracks</small></h1>
</div>

<div class="filters">
  <div class="filter-group">
    <label>Search</label>
    <input
      type="text"
      name="q"
      value="{{ q }}"
      placeholder="Track, artist, or release…"
      class="input-wide"
      hx-get="/catalog"
      hx-trigger="input changed delay:300ms"
      hx-target="#catalog-body"
      hx-swap="innerHTML"
      hx-include="[name='artist_filter']">
  </div>
  <div class="filter-group">
    <label>Artist</label>
    <select
      name="artist_filter"
      hx-get="/catalog"
      hx-trigger="change"
      hx-target="#catalog-body"
      hx-swap="innerHTML"
      hx-include="[name='q']">
      <option value="">All artists</option>
      {% for a in artists %}
      <option value="{{ a.id }}" {% if a.id == artist_filter %}selected{% endif %}>{{ a.name }}</option>
      {% endfor %}
    </select>
  </div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Track</th>
        <th>Artist</th>
        <th>Release</th>
        <th>#</th>
        <th>Duration</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="catalog-body">
      {% include "catalog/_table_body.html" %}
    </tbody>
  </table>
</div>
{% endblock %}
