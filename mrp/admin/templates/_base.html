<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MRP Admin{% block page_title %}{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-brand"><span>MRP</span> Admin</div>
    <nav>
      <div class="nav-group">
        <div class="nav-label">Content</div>
        <a href="/releases" {% if request.url.path.startswith('/releases') or request.url.path == '/missing-links' %}class="active"{% endif %}>Releases</a>
        <a href="/catalog" {% if request.url.path.startswith('/catalog') %}class="active"{% endif %}>Catalog</a>
        <a href="/artists" {% if request.url.path.startswith('/artists') %}class="active"{% endif %}>Artists</a>
        <a href="/actors" {% if request.url.path.startswith('/actors') %}class="active"{% endif %}>Actors</a>
        <a href="/posts" {% if request.url.path.startswith('/posts') %}class="active"{% endif %}>Posts</a>
        <a href="/status" {% if request.url.path == '/status' %}class="active"{% endif %}>Status</a>
        <a href="/missing-links" {% if request.url.path == '/missing-links' %}class="active"{% endif %}>Missing Links</a>
        <a href="/changes" {% if request.url.path.startswith('/changes') %}class="active"{% endif %}>Changes<span
          hx-get="/changes/badge" hx-trigger="load, every 20s" hx-swap="innerHTML"></span></a>
      </div>
      <div class="nav-group">
        <div class="nav-label">Analytics</div>
        <a href="/metrics" {% if request.url.path.startswith('/metrics') %}class="active"{% endif %}>Metrics</a>
      </div>
      <div class="nav-group">
        <div class="nav-label">Tools</div>
        <a href="/critic" {% if request.url.path == '/critic' %}class="active"{% endif %}>Critic</a>
        <a href="/promoter" {% if request.url.path == '/promoter' %}class="active"{% endif %}>Promoter</a>
        <a href="/sampler" {% if request.url.path == '/sampler' %}class="active"{% endif %}>Sampler</a>
      </div>
    </nav>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
  <script>
    // Validation failures come back as a 422 partial. htmx drops error
    // responses by default, which would leave the user with a silent
    // "422 Unprocessable Entity" in the console, so swap them in as content.
    document.body.addEventListener('htmx:beforeSwap', (event) => {
      if (event.detail.xhr.status === 422 && event.detail.target) {
        event.detail.shouldSwap = true;
        event.detail.isError = false;
      }
    });

    // htmx honours HX-Redirect by assigning window.location.href. When the
    // target is the page we are already on, that assignment is a same-document
    // navigation and the browser does nothing — a save then appears to have no
    // effect until the user refreshes by hand. Editors that redirect back to
    // the scene being edited hit this on every save, so force a real reload.
    document.body.addEventListener('htmx:beforeOnLoad', (event) => {
      const xhr = event.detail && event.detail.xhr;
      if (!xhr) return;
      let target;
      try {
        target = xhr.getResponseHeader('HX-Redirect');
      } catch (err) {
        return;
      }
      if (!target) return;
      const url = new URL(target, window.location.href);
      if (url.pathname !== window.location.pathname) return;
      if (url.search !== window.location.search) return;
      // Same page: htmx's assignment would be a no-op, so take over.
      event.preventDefault();
      if (url.hash && url.hash !== window.location.hash) {
        window.location.hash = url.hash;
      }
      window.location.reload();
    });
  </script>
</body>
</html>
