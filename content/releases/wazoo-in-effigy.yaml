      apple_music: https://music.apple.com/us/album/wazoo-in-effigy/6811367372?i=6811367384
      youtube: https://www.youtube.com/watch?v=T5r4GkOdXsI
      youtube_music: https://music.youtube.com/watch?v=T5r4GkOdXsI
    style: Art-rock/post-punk fused with modern jazz in 7/8, male baritone vocals
      with clipped, dry, melody-first phrasing; dry tom-driven drums, marimba ostinatos,
      angular bass, off-kilter kicks, soprano saxophone squeals, sparse trumpet and
      trombone replies, dissonant brass clusters, low strings, electric piano, and
      guitar, Suspended pre-chorus tension snaps into jagged forward motion through
      abrupt stop-start edits, tightening ensemble cuts, shifting meters, and massive
      unison peaks, ‑auto-tune, ‑pop vocal runs, ‑melisma, ‑EDM, ‑trap, ‑lo-fi, ‑power
      ballad, ‑emotive rock vocals, ‑gang vocals, ‑choir
    lyrics_raw: '[Intro | fragmented brass stabs | marimba pulse | 7/8 | no vocal]


      [Verse 1 | male baritone | dry, clipped, unhurried | sparse brass replies]

      Wazoo? He thinks the room is beneath him.

      Counts every ticket, then insults the seats.

      Technique, certainly. Feeling? I doubt it.

      Everything measured; nothing that bleeds.

      Smarter than everyone. That''s the posture.

      Filth when the difficult music runs long.

      Calls it satire whenever you catch him.

      Ask what he loves. He''ll tell you what''s wrong.


      [Pre-Chorus | rising brass figures | shorter phrases]

      So what do we call it?

      Contempt? Vanity?

      Cruelty dressed up

      as integrity?

      You made the impression.

      You fed us the evidence.

      What else are we meant to believe?


      [Chorus | male baritone | full electric orchestra | broad angular melody]

      I wrote what I heard.

      I said what I saw.

      You wanted approval;

      I wouldn''t applaud.

      Call that contempt.

      Call honesty ugly.

      Wazoo in effigy?


      Guilty.


      [Interlude | 11/8 | marimba and low brass unison | woodwind counterpoint | abrupt
      stop]


      [Verse 2 | male baritone | denser phrasing | woodwind replies]

      Pretentious, academic — put that in print.

      Difficult mostly for difficulty''s sake.

      A talent for sneering, a taste for the gutter.

      He calls it a mirror. I call it a fake.

      And can he play rock? Well, hardly the question.

      A loser in costume, impressed with his brain.

      You''ll find this opinion remarkably common.

      Ask anyone qualified. Ask them again.


      [Pre-Chorus | rising brass | tighter ensemble | more insistent]

      So what do we call it?

      Contempt? Vanity?

      Cruelty dressed up

      as integrity?

      You made the impression.

      You handed us kindling.

      What else were we given to hear?


      [Chorus | male baritone | full electric orchestra | broader brass]

      I wrote what I heard.

      I said what I saw.

      You wanted approval;

      I wouldn''t applaud.

      Call that contempt.

      Call honesty ugly.

      Wazoo in effigy?


      Guilty.


      [Verse 3 | male baritone | reduced arrangement | dry, restrained, no vibrato]

      Ask the men who were in the band beside him.

      Ask what perfection was worth in the end.

      Three hundred dollars to make both the records;

      Ten thousand later for hired-in men.

      A phone call finished what years had assembled.

      The salaries stopped. As of last week. That''s clear.

      Brilliant, perhaps — but brilliance is cheaper

      When somebody else pays the price to be near.


      [Break | bass and percussion only | no vocal | hard stop]


      [Bridge 1 | spoken, flat, unhurried | low strings beneath]

      So I asked the wild side hero.

      "Wazoo? The single most untalented person I''ve heard in my life.

      Two-bit.

      Pretentious.

      Academic.

      He can''t play his way out of anything."


      Twenty years later, that same wild man,

      Stood at a podium and inducted him into the Hall.

      No correction was printed.

      Corrections are not printed.


      [Bridge 2 | male baritone | critic voice | low winds and electric piano]

      By then he was dying. He went there regardless.

      Germany. Conducting. That unplayable score.

      They played it. The room stayed on its feet twenty minutes.

      Sentiment, surely. We''ve seen it before.

      No need to revise what was already printed.

      No reason to soften a judgment because —


      [Break | ensemble cuts to silence]


      [Reprise | close mic | conversational | a different man speaking | no accompaniment]

      Like I invented this?


      [Pre-Instrumental | the same line, the other voice | quiet | then nothing]

      I wrote what I heard.


      [Build | marimba figure alone | instruments enter one by one | accelerating
      counterpoint]


      [Instrumental | full electric orchestra | extreme ensemble precision | rapidly
      shifting meters | brass and woodwind blocks | guitar answers | final massive
      unison]


      [Outro | sudden dry silence | spoken, flat, bored]

      Have I got to listen to this?

      [Silence for a beat]

      Talentless.


      [End]'
