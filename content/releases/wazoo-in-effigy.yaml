  - number: 3
    title: Municipal Tongue Clamp
    slug: municipal-tongue-clamp
    isrc: SE6XX2639700
    duration: '5:56'
    explicit: false
    instrumental: false
    preview_audio: /samples/michael-anthony-rose--municipal-tongue-clamp.mp3
    links:
      spotify: https://open.spotify.com/track/5hfEHc1lfZoN33DHcjt1rZ
      apple_music: https://music.apple.com/us/album/municipal-tongue-clamp/6811367372?i=6811367376
      youtube: https://www.youtube.com/watch?v=yr7J35NYNFY
      youtube_music: https://music.youtube.com/watch?v=yr7J35NYNFY
    style: Experimental satirical prog/jazz-rock with laid-back slanted big-band energy,
      sparse studio arrangement and dry separation; electric piano, bass clarinet,
      marimba, vibraphone, angular electric guitar, alto/baritone sax, bass, drums
      and analog synth leave space around a male baritone dry talk-sing and mock-official
      announcer delivery, with an absurdly catchy cheerful chorus from a few male/female
      civic voices, Crooked 7/8, 5/4, 9/8 and 11/8 figures sit lightly against restrained
      4/4, with precise ensemble stabs, displaced accents, a quietly developing contrapuntal
      instrumental break, sinister doo-wop bridge, and tiny lounge-combo outro; modern
      punch, controlled dynamics, no chaos.
    lyrics_raw: '[Intro | spoken municipal announcement | cheerful electric piano
      | bass clarinet | marimba | abrupt ensemble punctuation]


      Good afternoon, residents.


      The Department of Audible Nuisance

      would like to remind you

      that unrestricted articulation

      is a privilege—


      —not a mouth right.


      Please remain linguistically available

      for inspection.


      [Instrumental stab]


      Thank you.


      [Verse 1 | dry talk-sing | crooked 7/8 and 4/4 alternation]


      They put a little window in the payment booth

      with a laminated chart of Acceptable Truth.

      You stick your chin through aperture B,

      say your legal name and count to three.


      “Ahhh.”


      Too broad.


      “Ehhh.”


      Too shrill.


      “Oooo.”


      That vowel requires a supplemental bill.


      The clerk takes a ruler to the underside,

      checks the lateral wag and the opening wide.

      Then she reaches underneath with a municipal lamp—


      [Ensemble stop]


      —and fits you for a tongue clamp.


      [Chorus | absurdly cheerful | stacked male/female civic choir | straight 4/4
      with odd-bar interruptions]


      Clamp it down, citizen,

      nice and snug.

      Keep your adjectives under the rug.


      Clamp it down, neighbor,

      watch that tone.

      Opinions are permitted

      when properly known.


      One little click

      for the public good.

      Say only what a reasonable resident should.


      No need to shout.

      No need to stamp.


      You’ve got yourself

      a Municipal Tongue Clamp.


      [Post-chorus | marimba and sax unison]


      Clamp—

      click.


      Clamp—

      click.


      Civic improvement!


      [Verse 2 | bass-led 5/4 | increasingly animated vocal]


      There’s a Schedule C for sarcasm use,

      a Form 9-D for rhetorical abuse.

      Irony’s legal on alternate weeks

      if nobody laughs and the applicant speaks


      slowly.


      Metaphor needs a temporary tag.

      Hyperbole travels in an opaque bag.

      Questions beginning with “Who says so?”

      must enter through the loading dock below.


      You may criticize weather,

      pavement,

      dogs,


      and certain pre-approved

      catalogued frogs.


      But mention the budget, the mayor, or the ramp—


      [Full band choke]


      —you’re looking at an auxiliary clamp.


      [Chorus | larger ensemble | bari sax counterline | choir increasingly enthusiastic]


      Clamp it down, citizen,

      nice and snug.

      Keep your adjectives under the rug.


      Clamp it down, neighbor,

      watch that tone.

      Opinions are permitted

      when properly known.


      One little click

      for the public good.

      Say only what a reasonable resident should.


      No need to shout.

      No need to stamp.


      You’ve got yourself

      a Municipal Tongue Clamp.


      [Spoken Interlude | mock instructional film | sparse vibraphone and bass]


      Proper clamp maintenance

      is the responsibility of the wearer.


      Do not lubricate with alcohol,

      religion,

      politics,

      romance,

      or information obtained

      from your brother-in-law.


      If spontaneous honesty occurs,

      remain calm.


      Place both hands where the municipality can see them

      and hum an approved melody.


      [Quiet voice]


      Not that one.


      [Instrumental Break | furious contrapuntal ensemble | 11/8 → 9/8 → 4/4 | electric
      guitar, alto sax, marimba and synth trade the same angular theme | bass and
      drums continually displace downbeat]


      [Bridge | theatrical half-time | sinister doo-wop harmony underneath lead]


      Now Jimmy at the tire shop

      said the pothole cracked his wheel.


      Mary said the councilman

      might know how people feel.


      Eddie said the property tax

      seemed—


      [Metallic SNAP]


      Eddie?


      Eddie?


      [Background voices, sweetly]


      Mmmmmmmmm.


      [Lead]


      Excellent compliance, Eddie.


      Your silence has been entered

      into the permanent record.


      [Breakdown | low bass clarinet | whispered percussion | voice becoming genuinely
      incredulous]


      Soon nobody remembered

      what the ordinance was for.


      Nobody could ask

      because asking cost more.


      They built a second office

      to administer the first,

      then a Department of Unsaying

      for citizens who’d rehearsed.


      There were inspectors inspecting inspectors

      for unauthorized inspection,

      and a blue-ribbon panel

      on mandibular discretion.


      Every mouth in town

      was certified damp—


      and nobody knew

      who ordered the clamp.


      [Final Chorus | huge grotesque civic pageant | 4/4 continually sabotaged by
      3/8 bars]


      Clamp it down, citizen,

      nice and snug!

      Sweep the troublesome words

      under the rug!


      Clamp it down, neighbor,

      mind that tone!

      Your thoughts remain yours—


      [Spoken aside]


      subject to applicable zoning.


      One little click

      for the public good!

      Say absolutely nothing

      like a reasonable resident should!


      No need to think.

      No need to stamp.


      Praise be unto

      the Municipal Tongue Clamp!


      [Choir]


      MUN-I-CI-PAL!


      [Band hit]


      TONGUE!


      [Band hit]


      CLAMP!


      [Band hit]


      [Outro | sudden tiny lounge combo | brushes, electric piano, upright-style electric
      bass]


      [Spoken, pleasant]


      The Department of Audible Nuisance

      thanks you for your cooperation.


      Your clamp must be renewed annually.


      Late fees begin

      before you receive this notice.


      [Pause]


      Open wide.


      [Metallic click]


      [Very quietly]


      Perfect.'
