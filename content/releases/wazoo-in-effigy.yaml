    lyrics_raw: '[Intro | marimba and flute mimic a woman walking in a revealing dress]

      [Spoken]

      What a lovely woman…

      [Verse 1 | dry talk-sing | angular bass | clipped synth replies]

      There’s the glance.

      There’s the second glance.

      There’s the third one you disguise

