    style: Experimental progressive rock/jazz fusion with dry male talk-sung vocals,
      a 7/8 pulse shifting through polymetric meters and unstable key centers; marimba
      carries the central walking motif while flute, electric piano, clipped synths,
      angular bass, interlocking guitars, layered keyboards, and polyrhythmic drums
      answer around it, with 5/4 broken-waltz turns, 3+2 accents, a shortened 4/4
      bar, stacked chorus harmonies, and abrupt classical ensemble cuts in a dry stop-start
