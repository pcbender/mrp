    lyrics_text: "[Instructions: this is long form composition. A long form tone poem\
      \ in four movements using the chorus to connect the individual sections. Take\
      \ your time, let the song breathe.\n[Intro]\n[acoustic guitar plays the melody\
      \ of the first movement in the key of E]\nSentia\n[lite drums join while synth\
      \ plays the melody of the second movement in the key of A]\nSentia\n[bass playing\
      \ fifths joins while a cello plays the melody of the third movement in the key\
      \ of G]\nSentia\n[the quartet plays the melody of the coda in the key of F#\
      \ minor]\nSentia\n[movement 1]\n[based on the movement 1 melody introduced in\
      \ the intro with variations]\nBe as the field after harvest\nnot barren, but\
      \ vacuus.\nThe husks are gone, the noise is gone;\nwhat remains is fertile waiting.\n\
      Do not fear this clearing.\nThe vessel serves what it holds open;\na sky is\
      \ vast because it is clear.\nEmptiness is not absence\nit is readiness.\n[Chorus]\n\
      [an intervallic rising vocal line, slow and deliberate]\nSentia\nSentia\n[Solo\
      \ | Clean Electric guitar]\n[Give the listener time to ponder]\n[movement 2]\n\
      [based on the movement 2 melody introduced in the intro with variations]\nNow\
      \ feel the moment tighten.\nLean into the now\nas the bow leans into the string.\n\
      Your awareness is not a wandering eye,\nbut attentus\na single, humming line\
      \ of light.\nYou are the hunter and the mountain,\nperfectly poised,\nstretched\
      \ toward the roiling chasm.\nAnd at the peak of presence,\nlet the knot undo\
      \ itself.\n[Chorus]\n[an intervallic rising vocal line, slow and deliberate]\n\
      Sentia\nSentia\n[Solo | synth]\n[Give the listener time to ponder]\n[Movement\
      \ 3]\n[based on the movement 3 melody introduced in the intro with variations]\n\
      You are not the archer; you are not the arrow.\nYou are not the story; they\
      \ are spaces you move through.\nBe solutus \nunfastened, unbound, wet clay.\n\
      Like a liminal strand at the water’s edge,\nleave names behind.\nYou do not\
      \ disappear;\nyou simply stop ending\nwhere your skin begins.\nEmpty. Attentive.\
      \ Free.\n[Chorus]\n[an intervallic rising vocal line, slow and deliberate]\n\
      Sentia\nSentia\n[Solo | Distorted Electric guitar]\n[Give the listener time\
      \ to ponder]\n[Coda]\n[based on the coda melody introduced in the intro with\
      \ variations]\nSentia\nyou are not less;\nyou are when\nbeginnings\nbegin\n\
      [Solo | Synth]\n[Weaving lines of guitar and synth fade out]"
