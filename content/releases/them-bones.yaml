    style: Alternative rock track in E major at 60 BPM. The arrangement features clean,
      arpeggiated electric guitars with light chorus and delay, layered over a steady
      mid-tempo drum beat. A melodic bass guitar line follows the chord progression
      with eighth-note pulses. Male vocals transition from a breathy, intimate delivery
      in the verses to a powerful, belted chest voice in the choruses. The choruses
      are characterized by layered vocal harmonies and sustained electric guitar power
      chords with moderate overdrive. A bridge section features a melodic electric
      guitar solo with a smooth, singing tone and heavy reverb. The track concludes
      with a sparse outro featuring clean guitar arpeggios and fading vocal ad-libs.
    lyrics_raw: '[Intro]

      [clean electric guitar arpeggio with chorus, light delay]

      [Verse 1]

      [breathy male vocals]

      Have you run aground?

      Did you miss that sound?

      Is there mist between the sails that spins the cock around?

      [vocal harmonies]

      Have you run aground?

      Did you miss that sound?

      [Pre-chorus]

      You feel it now, don’t you…

      [Chorus]

      [overdriven electric guitar power chords, driving drums]

      Rattle me down them bones

      Rattle me down to sleep

      Rattle me down them bones

      Rattle me down and weep

      [Instrumental Break]

      [clean guitar arpeggio, bass guitar eighth-note pulse]

      [Verse 2]

      Have you run aground?

      Did you miss that sound?

      The waves and dice lie, you know that now

      [vocal harmonies]

      Have you run aground?

      Did you miss that sound?

      [Pre-chorus]

      You feel it now, don’t you…

      [Chorus]

      [full band, belted vocals]

      Rattle me down them bones

      Rattle me down to sleep

      Rattle me down them bones

      Rattle me down and weep

      [Bridge]

      [melodic electric guitar solo, heavy reverb]

      [Outro]

      Did you miss that sound?

      [drums and bass drop out]

      Rattle me down them bones

      [clean guitar arpeggio fades]

      [vocal ad-libs fade]'
