    style: Alternative rock with post-grunge influences. Clean electric guitar arpeggios
      with chorus and delay effects open the track, transitioning into heavy distorted
      power chords during the chorus. A driving drum kit features a prominent snare
      and active hi-hat patterns. The bass guitar follows the root notes of the guitar
      progression with a thick, overdriven tone. Male vocals are delivered in a baritone
      range, shifting from a melodic, breathy delivery in the verses to a powerful,
      gritty belt in the choruses. The tempo is 120 BPM in the key of D major.
    lyrics_raw: '[Intro]

      [clean electric guitar arpeggios with chorus and delay]

      [Verse 1]

      [breathy male vocals]

      Moon low in the eastern sky

      Clouds where they should be

      Nowhere seen

      Too hot for the dark

      Air heavy with sound

      Wordlessly

      [Chorus]

      [distorted electric guitar power chords, driving drums]

      Darkness takes the shadows

      The clock chimes twice

      Nothing but silence calling my name

      (Oh-oh-oh)

      (Oh-oh-oh)

      [Verse 2]

      [clean electric guitar arpeggios return]

      Wind lifts sand and leaves

      The smell of old things

      New to me

      Piles in the corners

      A place to rest

      My eyes close

      [Bridge]

      [bass guitar and drums only, light guitar feedback]

      One leaf stirring

      [Chorus]

      [full band, high energy]

      Darkness takes the shadows

      The clock chimes twice

      Nothing but silence calling my name

      (Oh-oh-oh)

      (Oh-oh-oh-oh)

      (Oh-oh-oh-oh)

      (Ah)

      [Outro]

      [distorted guitar riff]

      Water finds a path

      Pooling, thinning, gone

      The air holds it, clouds gather

      Rain begins to fall

      (Oh-oh-oh-oh)

      (Oh-oh-oh-oh)

      [guitar solo with wah-wah effect]

      (Ah-ah-ah)

      [final drum hit and feedback fade]'
    lyrics_text: 'moon low in the eastern sky

      clouds where they should be

      nowhere to be seen

      too hot for the dark

      air heavy with sound

      no clapping

      darkness takes the shadows

      the clock chimes twice

      nothing but silence

      (Oh-oh-oh)

      (Oh-oh-oh)

      the smell of old things

      new to me

      piles in the corners

      a place to rest

      one leaf stirring

      darkness takes the shadows

      the clock chimes twice

      nothing but silence

      calling my name

      rain comes as the wind dies

      (Oh-oh-oh)

      (Oh-oh-oh-oh)

      (Oh-oh-oh-oh)

      (Ah)

      my eyes open

      darkness takes the shadows

      the clock chimes twice

      nothing but silence

      (Oh-oh-oh-oh)

      (Oh-oh-oh-oh)

      (Ah-ah-ah)

      the air holds it

      clouds gather

      rain begins

      darkness takes the shadows

      the clock chimes twice

      nothing but silence

      calling my name'
