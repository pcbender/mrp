    style: Male baritone, resonant, warm and open, nostalgic turning triumphant, Progressive
      rock, Canterbury scene, acoustic guitar in the verses, subtle synth shimmer
      on the machine verse, full band with soaring electric guitar, organ, strings,
      and layered backing vocals for the chorus and bridge, Warm live-ensemble production,
      the biggest sound on the album, thinning to acoustic guitar and voice alone
