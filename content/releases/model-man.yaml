      youtube: https://www.youtube.com/watch?v=vf_gzi-oD0w
      youtube_music: https://music.youtube.com/watch?v=vf_gzi-oD0w
    style: 'Progressive rock, Canterbury scene: angular ticking guitar-and-bass unison
      in odd meter, clipped organ jabs and alto saxophone interjections; resonant
      dry male baritone with understated wry delivery; syncopated phrasing over tight
      nervous grooves; warm live-ensemble production with gated room ambience, building
      breakdowns into a quiet hollowed-out outro, ‑autotune, ‑polished production'
    lyrics_raw: '[Intro - measured, deadpan]


      There is a manual.


      I want to be clear about that.


      There is one.

      I found it.


      Page one.

      Big letters.

      Nothing else on the page:


      Figure out what works for you.


      [Verse 1 - flat, methodical]


      Page two is blank.


      So is three.

      So is four.


      So is every page after that.


      I checked the back.

      Under the jacket.

      Held it to the window.


      Somebody printed

      four hundred blank pages

      and bound them properly.


      Somebody paid for that.


      [Chorus - bitter, building]


      Reed the manual.


      I red the manual.


      Cover to cover.

      Twice.

      Out loud.


      Figure out

      what works for you.


      [Verse 2 - weary, recounting]


      Went forward at an altar call

      and meant every word.


      Six good weeks.


      Then:


      pray on it, son.

      See what the Lord puts on your heart.


      Two years with a therapist—

      and she was good,

      I want that on the REK-ord—


      and at the end she asked

      what I thought would work for me.


      Ten days silent.

      Did it properly.

      Didn''t cheat once.


      Last day:


      go find your own practice.


      [Chorus - bitter, building]


      Reed the manual.


      I red the manual.


      Cover to cover.

      Twice.

      Out loud.


      Figure out

      what works for you.


      [Verse 3 - quiet, scholarly]


      So I went further back.


      Greek.

      Encyclopedia.

      A line a night.


      Over the door,

      before the door was old:


      [Slowly]

      NOH-thee say-OW-tahn.


      Know Yourself.


      Two and a half thousand years,

      and the front of the building

      still says the same thing.


      The page behind it

      is still blank.


      [Breakdown - raw, breaking open]


      Somebody did this.


      Somebody worked it out

      and stopped.


      That''s all I want.

      One person who''s finished.


      I have sat in every room

      and every room turns round at the end

      and hands it back.


      One sentence.

      Four hundred empty pages.


      Where''s the fucking manual?


      Nobody filled it in.


      Nobody ever filled it in.


      [Outro - hollowed out, quiet]


      Everywhere they said to go,

      I went.


      Page two.


      Pen.


      Figure out

      what works for you.'
