    lyrics_raw: '[Intro: dialogue, low piano]

      [Male narrator: bass, gravel voice]

      The nomination is secured.

      The polling is not.

      [Male narrator:| baritone, official voice]

      The polling is wrong.

      [Male narrator: bass, gravel voice]

      It may be.

      That is not presently useful.

      [Male narrator: baritone, official voice]

      How far behind?

      [Male narrator: bass, gravel voice]

      Far enough to need a friend who does not require friendship.

      [Sub-bass enters]

      [Verse 1 | private meeting]

      [Male narrator: baritone, official voice]

      Your office is difficult to find.

      [Male narrator: Clear Russian accent]

      That is why it remains mine.

      [Male narrator: baritone, official voice]

      I came without the papers.

      [Male narrator: Clear Russian accent]

      You came with every paper your country has written about you.

      [Male narrator: baritone, official voice]

      They say I’m losing.

      [Male narrator: Clear Russian accent]

      They say many things.

      [Male narrator: baritone, official voice]

      I will be better for your country than the woman running against me.

      [Male narrator: Clear Russian accent]

      You will be better for mine than for yours.

      [Silence]

      [Male narrator: baritone, official voice]

      That sounds like agreement.

      [Male narrator: Clear Russian accent]

      It sounds like arithmetic.

      [Pre-Chorus | low strings]

      No handshake for the camera

      No signature or seal

      No promise spoken plainly

      No term a court can feel

      A favor without language

      A debt without a date

      A door opened from elsewhere

      Before the ballots close

      [Chorus | low ensemble]

      [Male vocals: Clear Russian accent]

      All means necessary

      No method bears a name

      All means necessary

      No witness sees the same

      Change what they encounter

      Choose what reaches whom

      All means necessary

      And leave the choice inside the room

      [Verse 2]

      [Male vocals: Clear Russian accent]

      We can purchase little arguments

      And place them in the proper towns

      We can turn a rumor sideways

      Until honest hands pass it around

      We can make two neighbors certain

      They have never shared a street

      We can lift the weakest story

      And place it underneath their feet

      We can show each man a country

      Built exactly from his fear

      Then show another man beside him

      A different country just as clear

      [Male narrator: baritone, official voice]

      Can you change the count?

      [Male vocals: Clear Russian accent]

      Why change a count when you can change what makes a person count?

      [Male narrator: bass, gravel voice]

      The campaign is no longer trying to persuade the country.

      It is learning to overwrite it.

      [Pre-Chorus | signal interference increases]

      No army crosses water

      No flag appears at dawn

      The weapon looks like preference

      The wound looks self-drawn

      A thousand private hallways

      A million separate rooms

      One hand adjusts the lighting

      And every voter calls it truth

      [Chorus | deeper arrangement]

      All means necessary

      No method bears a name

      All means necessary

      No witness sees the same

      Change what they encounter

      Choose what reaches whom

      All means necessary

      And leave the choice inside the room

      [Instrumental Break | tremolo guitar | coded tones]

      [Verse 3]

      [Male narrator: baritone, official voice]

      When I win, we’ll speak as equals.

      I respect a powerful man.

      There are matters in the Eastern Hemisphere

      [Male vocals: Clear Russian accent]

      You wanted the throne.

      [Male narrator: baritone, official voice]

      I want what I have earned.

      [Male vocals: Clear Russian accent]

      You want what can be taken.

      [Male narrator: baritone, official voice]

      And what do you want?

      [Long silence]

      [Male vocals: Clear Russian accent]

      The map.

      [Bridge | minimal piano and bass]

      [Male narrator: baritone, official voice]

      What price?

      [Male vocals: Clear Russian accent]

      Not today.

      [Male narrator: baritone, official voice]

      What guarantee?

      [Male vocals: Clear Russian accent]

      Your need.

      [Male narrator: baritone, official voice]

      What happens if I refuse?

      [Male vocals: Clear Russian accent]

      You will not remember that you agreed.

      [Male narrator: baritone, official voice]

      I agree to nothing.

      [Male vocals: Clear Russian accent]

      Good.

      [Final Chorus | Dr. joins too eagerly]

      All means necessary

      No method bears a name

      All means necessary

      We never met to make a claim

      Change what they encounter

      Choose what reaches whom

      All means necessary...

      [Male vocals: Clear Russian accent]

      I will collect when there is no other room.

      [Outro | transfer tone]

      [Male narrator: bass, gravel voice]

      Doctor, congratulations.

      [Male narrator: baritone, official voice]

      We haven’t won.

      [Male narrator: bass, gravel voice]

      That is now a technical detail.

      [Campaign victory broadcast enters]

      (Hail To The Chief plays)

      [End]'
