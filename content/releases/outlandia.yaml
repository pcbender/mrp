      \ Male vocal 1 and Female vocal 1 | duet | farther away]\n Straighten his collar\n\
      \ Stand him beside us\n People see promise\n When people see titles\n\n [Chorus\
      \ | Male vocal 1 and Female vocal 1 | duet | fuller band]\n Call him Doctor,\
      \ call him now\n Pin the title to his gown\n Give him something he can claim\n\
      \ Before he learns his given name\n Call him Doctor, make it true\n He’ll become\
      \ what we announce him to\n\n [Instrumental Break | low cello | faint crackling]\n\
      \n [Domestic Scene | restrained parlando]\n\n [Black Female Vocal | plain contralto]\n\
      \ Are you playing with that magnifying glass again?\n I smell something burning.\n\
      \ What are you doing?\n\n [Young Male Vocal | Tenor]\n Nothing.\n Just playing\
