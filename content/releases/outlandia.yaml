      [Female Narrator: Smooth alto, no emotion]

      Household movement detected.

      All occupants accounted for.

      [Greatness Fanfare reduced to a soft five-note notification]

      [Spoken Dialogue]

      [Female Narrator: Smooth alto, no emotion]

      Outlandia is secure.


      [Theme swells to its Creschendo]


      [Fade out]'
