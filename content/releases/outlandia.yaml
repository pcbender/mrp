    lyrics_raw: '[Intro | unified transmission continues | low organ pedal]

      [State Voice]

      Better Outlandia

      Emergency Continuance

      Day One

      [Male high baritone | dry low register]

      The former constitution

      Was for a quieter age

      The present emergency

      Needs a living page

      Therefore, by the authority

      Of necessity itself

      I suspend the former limits

      For health and continuity

      [Low brass enters]

      [Minister of Law]

      Can necessity grant authority?

      [Male high baritone]

      It just did.

      [Red Shirts]

      First things first.

      [Verse 1 | Male high baritone]

      Close the chamber

      Clear the hall

      Put the old text against the wall

      Strip the seals

      Replace the guard

      Law is whatever keeps us hard

      Call each judge

      Call every chair

      Call the men who thought their titles mattered

      Bring their spouses

      Bring their files

      Bring the photos they keep beside them

      [Pre-Chorus | Red Shirts | rigid unison]

      Name

      Office

      Property

      Family

      Breath

      Nothing stays private

      After the state

      [Chorus | full mass ensemble]

      First things first

      Put your name beneath the man

      First things first

      Give your office to his hand

      Keep your house

      Keep your children

      Keep the air inside your chest

      First things first

      Obedience decides the rest

      [Verse 2 | loyalty ceremony]

      [State Clerk]

      Justice Vale.

      [Justice Vale | exposed tenor]

      I served the charter forty years.

      I can''t sign away the court.

      [Male high baritone]

      Then you''ve signed your answer.

      (Door opens)

      [Red Shirts]

      Step forward.

      (Door closes)

      [State Clerk]

      Governor Hale.

      [Governor Hale | trembling baritone]

      I pledge my name and office

      My property and breath

      To the Continuance of Doctor

      And whatever comes next

      [Male high baritone]

      “Whatever” sounds uncertain.

      [Governor Hale]

      To Better Outlandia

      Until my natural death.

      [Male high baritone]

      Approved.

      [Pre-Chorus | larger ensemble]

      Name

      Office

      Property

      Family

      Breath

      Nothing stays lawful

      Until it serves the state

      [Chorus | heavier percussion]

      First things first

      Put your name beneath the man

      First things first

      Give your office to his hand

      Keep your house

      Keep your children

      Keep the air inside your chest

      First things first

      Obedience decides the rest

      [Section III | accelerating procession]

      [State Clerk]

      Speaker Morin.

      [Speaker]

      I sign.

      [State Clerk]

      General Cask.

      [General]

      I sign.

      [State Clerk]

      Director Fen.

      [Director]

      I sign.

      [State Clerk]

      Treasurer Lott.

      [Treasurer]

      Where do I sign?

      [Male high baritone]

      There.

      [Male high baritone]

      See?

      Law has gotten efficient.

      [Instrumental Break | organ and anvil]

      [Section IV | arrangement withdraws]

      [State Clerk]

      Donin Black.

      [Donin | Male calm bass-baritone]

      I wondered how long you''d leave my name at the bottom of the page.

      [Male high baritone]

      You know too much.

      [Male calm bass-baritone]

      I taught too much.

      [Male high baritone]

      Sign.

      [Donin | Male calm bass-baritone]

      Would it matter?

      [Male high baritone]

      It would show respect.

      [Male calm bass-baritone]

      Respect was never

      Part of the method.

      [Male high baritone]

      You said loyalty

      Was usefulness.

      [Donin | Male calm bass-baritone]

      It is.

      [Male high baritone]

      You''re no longer useful.

      [Male calm bass-baritone]

      Then you''ve learned it.

      [Male high baritone]

      Sign the pledge.

      [Male calm bass-baritone]

      No.

      [Male high baritone]

      Are you surprised?

      [Male calm bass-baritone]

      Of course.

      (Door closes)

      (Sound of gun shot)

      [Bridge | Male high baritone alone]

      No teacher owns the lesson

      No father owns the name

      No partner owns the bargain

      No witness owns the claim

      Debt belongs to weaker men

      History belongs to print

      Print belongs to government

      Government belongs to him

      [Final Chorus | ensemble]

      First things first

      Put your name beneath the man

      First things first

      Give your memory to his hand

      Keep your house

      Keep your children

      Keep the air inside your chest

      First things first

      Obedience decides the rest

      [Synthetic Voice]

      Never preserve

      What power has outgrown.

      Never keep a witness

      When the lesson can be cloned.

      [Outro | state choir on one chord]

      [Male high baritone]

      Next.

      [State Clerk]

      The technology delegation

      Is waiting downstairs.

      [End]'
