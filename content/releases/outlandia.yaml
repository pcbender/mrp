    style: Rock, progressive art-rock overture at 96 BPM, alternating stately 4/4
      with crooked 6/8. Patriotic brass and pipe organ collide with calliope, distorted
      electric guitar, marching snare, low analog synth, and metallic junk percussion.
      Mixed theatrical ensemble sings clipped national slogans while a plain contralto
      wordless motif threads underneath. Warm tape saturation, wide stereo, abrupt
      scene cuts, ominous music-box ending.
    lyrics_raw: "[Intro | instrumental | five-note brass fanfare]\n\n[Pipe organ enters]\n\
      \n[National Ensemble | formal unison]\nOutlandia, shoulders back\n Hold the\
      \ pose and hide the crack\n Chin up high and banners spread\n Mind the paint\
      \ above your head\n\n[Marching snare enters]\n\n[High Voices]\nFrom Madhatin’s\
      \ silver towers\n To the pines that teach us power\n\n[Low Voices]\nEvery child\
      \ receives the claim\n Every building bears the name\n\n[Full Ensemble]\nThe\
      \ greatest country that ever lived!\n Certified gold for the privileged\n Perfect\
      \ soil and perfect blood\n Pay no mind beneath the mud\n\n[Instrumental Break\
      \ | calliope and distorted guitar]\n\n[Commercial Quartet | bright clipped phrasing]\n\
      Buy the flag\n Bless the deal\n Sign below\n Make it real\n\n[Military Voices]\n\
      One nation under management\n One future under seal\n\n[Full Ensemble | expanding\
      \ harmony]\nOutlandia, take your place\n Every mirror shows your face\n If the\
      \ facts refuse the plan\n Build another where they stand\n\n[Break | brass cuts\
      \ out]\n\n[Nanny | wordless contralto]\nMm - mm\n Mm - mm\n Mm - mm - mm\n\n\
      [Low Ensemble | restrained]\nA woman warms a bottle\n A driver clears the gate\n\
      \ A father names an infant\n For the man he must create\n\n[Build | organ, guitars,\
      \ junk percussion]\n\n[Full Ensemble | increasingly forceful]\nGreatest\n Cleanest\n\
      \ Richest\n Best\nMeasure every beating chest\nGreatest\n Strongest\n First\
      \ in line\nEverything is yours -\n\n[Sudden Break]\n- on borrowed time\n\nDoctor\n\
      Doctor\nClose your eyes"
    lyrics_text: 'Outlandia, shoulders back

      Hold the pose and hide the crack

      Chin up high and banners spread

      Mind the paint above your head


      From Madhatin’s silver towers

      To the pines that teach us power


      Every child receives the claim

      Every building bears the name


      The greatest country that ever lived

      Certified gold for the privileged

      Perfect soil and perfect blood

      Pay no mind beneath the mud


      Buy the flag

      Bless the deal

      Sign below

      Make it real


      One nation under management

      One future under seal


      Outlandia, take your place

      Every mirror shows your face

      If the facts refuse the plan

      Build another where they stand


      Mm - mm

      Mm - mm

      Mm - mm - mm


      A woman warms a bottle

      A driver clears the gate

      A father names an infant

      For the man he must create


      Greatest

      Cleanest

      Richest

      Best

      Measure every beating chest

      Greatest

      Strongest

      First in line

      Everything is yours -


      - on borrowed time

      Doctor

      Doctor

      Close your eyes'
