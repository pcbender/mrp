      apple_music: https://music.apple.com/us/album/man-school/6792355451?i=6792355457
    style: Rock, industrial hard rock at 132 BPM with rigid marching toms, baritone
      guitar, distorted bass, metallic dining-hall percussion, low brass, and detuned
      boys’ ensemble. Commanding bass-baritone instructor, anxious high-baritone students,
      Dr. growing from restrained to domineering. Verses in severe 4/4; Golden Spoon
      ceremony shifts into a grotesque 3/4 waltz. Dry, forceful analog production.
    lyrics_raw: "[Start]\n[Intro | marching boots | low brass]\n\n [Male vocal | bass-baritone]\n\
      \ Iron Pines\n Shoulders square\n Strength through correction\n Starts right\
      \ here\n\n Beds at five\n Boots in line\n Every weakness\n Left behind\n\n [Verse\
      \ 1]\n [Young Male Vocal | upper baritone | and male students]\n Cold tin basin,\
      \ frozen ground\n Name one fear and pass it down\n Miss one mark, repeat the\
      \ mile\n Bleed inside your practiced smile\n\n Write your failure on the slate\n\
      \ Stand beside it, standing straight\n When they ask who spoiled the drill\n\
      \ Name the smallest boy you will\n\n [Pre-Chorus]\n [Male vocal | bass-baritone\
      \ | and male students]\n If you are weak: (Lie!)\n If you are caught: (Command!)\n\
      \ If you are beaten: (Love the whip!)\n And tell them that you planned it\n\n\
      \ [Chorus]\n [male ensemble | heavy unison]\n No boy leaves unbroken\n No bruise\
      \ goes to waste\n Swallow what they give you\n Keep a winner’s face\n\n When\
      \ the room begins to laugh\n Take the loudest place\n No boy leaves unbroken\n\
      \ No boy leaves with grace\n\n [Verse 2]\n [Young Male Vocal | upper baritone]\n\
      \ I learned to strike before the bell\n I learned the lie that traveled well\n\
      \ I learned a witness can be wrong\n When one rich father waits too long\n\n\
      \ I learned the trick behind the grin\n Never let the verdict in\n Call the\
      \ punishment a prize\n Make them doubt their open eyes\n\n [Pre-Chorus]\n [Young\
      \ Male Vocal | upper baritone | gaining confidence]\n If I am weak: (I planned\
      \ it!)\n If I am caught: (They lied!)\n If I am beaten: (Change the problem!)\n\
      \ Watch me claim the winning side\n\n [Chorus]\n [larger drums]\n [male ensemble\
      \ | heavy unison]\n No boy leaves unbroken\n No bruise goes to waste\n Swallow\
      \ what they give you\n Keep a winner’s face\n\n When the room begins to laugh\n\
      \ Take the loudest place\n No boy leaves unbroken\n No boy leaves with grace\n\
      \n [Interlude | grotesque ceremonial waltz]\n\n [Male vocal | bass-baritone]\n\
      \ Parents, patrons, family names\n Welcome to the final stage\n Each young man\
      \ will demonstrate\n His mastery of appetite and shame\n\n [Boys Choir | stiff\
      \ waltz]\n Golden spoon in every hand\n School crest stitched above the heart\n\
      \ In each bowl, his excrement\n In every seat, a familiar part\n\n Lift it high\n\
      \ Do not look down\n Eat it clean\n Accept the crown\n\n [Instrumental Break\
      \ | metallic clink, scrape, clink]\n\n [Young Male Vocal | upper baritone |\
      \ shaking at first]\n They waited for my eyes to drop\n They waited for my throat\
      \ to stop\n I climbed the chair above the room\n And raised the filthy golden\
      \ spoon\n\n I wiped my mouth\n I faced the hall\n I heard my father barely cough\n\
      \ Then said, “You paid to watch me win.\n You don’t decide when I have lost.”\n\
      \n [Bridge | full band enters hard]\n Laugh first\n Point first\n Name the score\n\
      \n Kick the loser\n Lock the door\n\n Take the stain\n Display it well\n\n Sell\
      \ the bruise\n And own the smell\n\n [Female vocal | Nanny | brief retrospective\
      \ | dry contralto]\n I pressed the uniform that night\n The crest was clean\n\
      \ The collar white\n\n Whatever happened on the stage\n Was not discussed\n\
      \ They paid the wage\n\n [Final Chorus | Young Male Vocal | upper baritone |\
      \ leads ensemble]\n I did not leave unbroken\n I taught the break to bow\n I\
      \ swallowed what they handed me\n And call it winning now\n\n When the whole\
      \ room starts to laugh\n I choose the time and place\n No boy leaves unbroken\n\
      \ A man controls disgrace\n\n [Outro | boots stop]\n\n [Metallic motif]\n Clink\n\
      \ Scrape\n Clink\n Eat shit and die!\n… I am reborn\n [End]"
    lyrics_text: 'Iron Pines

      Shoulders square

      Strength through correction

      Starts right here

      Beds at five

      Boots in line

      Every weakness

      Left behind


      Cold tin basin, frozen ground

      Name one fear and pass it down

      Miss one mark, repeat the mile

      Bleed inside your practiced smile

      Write your failure on the slate

      Stand beside it, standing straight

      When they ask who spoiled the drill

      Name the smallest boy you will


      If you are weak: (Lie!)

      If you are caught: (Command!)

      If you are beaten: (Love the whip!)

      And tell them that you planned it


      No boy leaves unbroken

      No bruise goes to waste

      Swallow what they give you

      Keep a winner’s face

      When the room begins to laugh

      Take the loudest place

      No boy leaves unbroken

      No boy leaves with grace


      I learned to strike before the bell

      I learned the lie that traveled well

      I learned a witness can be wrong

      When one rich father waits too long

      I learned the trick behind the grin

      Never let the verdict in

      Call the punishment a prize

      Make them doubt their open eyes


      If I am weak: (I planned it!)

      If I am caught: (They lied!)

      If I am beaten: (Change the problem!)

      Watch me claim the winning side


      No boy leaves unbroken

      No bruise goes to waste

      Swallow what they give you

      Keep a winner’s face

      When the room begins to laugh

      Take the loudest place

      No boy leaves unbroken

      No boy leaves with grace


      Parents, patrons, family names

      Welcome to the final stage

      Each young man will demonstrate

      His mastery of appetite and shame


      Golden spoon in every hand

      School crest stitched above the heart

      In each bowl, his excrement

      In every seat, a familiar part

      Lift it high

      Do not look down

      Eat it clean

      Accept the crown


      They waited for my eyes to drop

      They waited for my throat to stop

      I climbed the chair above the room

      And raised the filthy golden spoon

      I wiped my mouth

      I faced the hall

      I heard my father barely cough

      Then said, “You paid to watch me win

      You don’t decide when I have lost.”


      Laugh first

      Point first

      Name the score

      Kick the loser

      Lock the door

      Take the stain

      Display it well

      Sell the bruise

      And own the smell


      I pressed the uniform that night

      The crest was clean

      The collar white

      Whatever happened on the stage

      Was not discussed

      They paid the wage


      I did not leave unbroken

      I taught the break to bow

      I swallowed what they handed me

      And call it winning now

      When the whole room starts to laugh

      I choose the time and place

      No boy leaves unbroken

      A man controls disgrace


      Clink

      Scrape

      Clink

      Eat shit and die

      … I am reborn'
