    lyrics_raw: '[Intro | fingerpicked nylon-string guitar | distant wind chimes |
      sparse]

      [Verse 1 | warm intimate vocal | guitar and recorder | unhurried phrasing]

      cat distracted

      one eye closed

      the sun remembering

      after dark


      broom sweeping

      a clean floor

      the sound of steps

      unheard


      [Chorus | gentle lift | piano countermelody | soft single voice]

      grass still wet

      one bird searches

      the road bends away

      a good day to be

      before the wind changes


      [Verse 2 | guitar and recorder | gentle upright bass enters | patient]

      smell of cumin

      the kitchen window open

      rain finding the dust

      already dry


      shadows longer

      wind chimes ring

      the crickets

      keep their distance


      [Chorus | warmer | quiet harmony added | recorder and piano weave]

      grass still wet

      one bird searches

      the road bends away

      a good day to be

      before the wind changes


      [Bridge | stripped back | voice and single guitar | hold the space]

      a deep breath

      light through the curtain

      blanket on the floor


      [Final Chorus | fullest yet still soft | layered harmonies | chimes swell |
      settles]

      grass still wet

      one bird searches

      the road bends away

      a good day to be

      before the wind changes

      [Outro | guitar and chimes fade | room tone]'
