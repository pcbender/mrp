    style: 'Rock, Progressive Rock with a 1970s psychedelic texture: slow 4/4 measured
      pulse, clean electric guitar figures through tape delay, warm melodic bass,
      Hammond organ on rotary speaker, subtle analog synth pads, restrained round
      drums with dry kick and soft ride; calm, dry, conversational weary male lead,
      older male spoken mumble, soulful female backing voices and broad harmony stacks;
      tape saturation, analog warmth, wide stereo image, natural dynamics, fractured
      slightly out-of-tune verse backdrop, ominous restrained tension'
    lyrics_raw: '[Intro | clean electric guitar figure | Hammond organ | restrained
      drums]

      [Verse 1 | calm close vocal | sparse arrangement]

      There''s a mad man in the people''s house

      There''s a mad man in the people''s house

      He has the key. He''s past the gate.

      He only sleeps by mistake

      Cannot keep the mad man in the house


      [Verse 2 | bass more present | quiet tension]

      There''s a mad man in a broken pool

      There''s a mad man in a broken pool

      He doesn''t swim. He won''t be told.

      The deep end''s dry. The tiles are cold.

      Cannot keep the mad man in the house


      [Chorus | arrangement opens | fuller drums | harmony vocals]

      And when his rage comes thundering through the halls

      And the minders on the hill have gone to ground

      And the shouting is the only thing we hear

      Some day there''ll be a January to cheer


      [Interlude | electric guitar motif | Hammond organ]


      [Verse 3 | restrained vocal | mounting tension]

      There''s a mad man in the cabinet room

      There''s a mad man in the cabinet room

      He wants a yes. He wants it now.

      One by one they learn to bow.

      Cannot keep the mad man in the house


      [Chorus | wider harmonies | fuller organ | stronger drums]

      And when his rage comes thundering through the halls

      And the minders on the hill have gone to ground

      And the shouting is the only thing we hear

      Some day there''ll be a January to cheer


      [Bridge | stripped back | voice forward | rising tension]

      We watched the doors swing open

      We watched the guards step aside

      We watched the decent people

      Find somewhere safe to hide

      But every house has windows

      And every lock can turn


      [Chorus | stacked harmonies | soulful female backing vocals | bigger drums]

      And when his rage comes thundering through the halls

      And the minders on the hill have gone to ground

      And the shouting is the only thing we hear

      Some day there''ll be a January to cheer


      [Interlude | Fractured verse background | slightly out of tune]

      [Older male spoken vocal | mumbling quietly | As if talking to himself]


      I think I’m really, if you think about it…

      The best ever

      I mean the best that ever lived

      Maybe even better than that

      I really do…


      [Final Chorus | widest arrangement | stacked harmonies | soulful female backing
      vocals | bigger drums]

      And when his rage goes quiet in the halls

      And the minders on the hill have stood their ground

      And the traffic is the only thing we hear

      That day will be a January to cheer


      [Outro | sustained organ and guitar chord | slow decay]


      That day will be a January to cheer


      [End]'
