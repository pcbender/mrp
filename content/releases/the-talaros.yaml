    style: 'Chill wave with ambient features and an odd, warped edge: hazy Juno-106
      pads, detuned electric piano, tape-wobble synth arps, and a distant MIDI guitar
      line through chorus and plate reverb, Slow 78 BPM, half-time drum machine, soft
      sub-bass, granular textures, reverse tails, and unresolved minor-key harmonies
      suspended in a weightless mix'
