  promo_blurb: PCBender is a sonic craftsman, a songwriter and producer who blends
    the analog warmth of classic rock and blues with a sharp, modern edge. His storytelling
    is front and center on a recent string of singles that explore feeling from every
    angle. On ["With Preposition"](/releases/with-preposition/), he turns grammar
    into a moving meditation on love, its conversational feel earning a quiet emotional
    weight. The track ["Try To Be Okay"](/releases/try-to-be-okay/) builds from the
    frustrations of daily life into a soaring, cathartic chorus with a funky, grounded
    momentum. Meanwhile, the woozy rhythm and layered vocals of ["It's June Gloom"](/releases/it-s-june-gloom/)
    perfectly capture an overcast, hazy mood. Each song reveals an artist who turns
    plainspoken observation into profound feeling, inviting listeners to find the
    extraordinary in the everyday.
