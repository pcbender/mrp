  promo_blurb: PCBender is a songwriter who maps the terrain of love, loss, and the
    search for meaning, pairing raw, confessional storytelling with expansive, atmospheric
    production. His recent singles showcase a dynamic musical range. ["Try To Be Okay"](/releases/try-to-be-okay/)
    channels airport frustration into an uplifting anthem, its soaring chorus held
    in place by a funky, determined groove. The conversational ["With Preposition"](/releases/with-preposition/)
    uses a clever lyrical conceit to deliver a poignant meditation on connection,
    while the patient ["Footsteps Again"](/releases/footsteps-again/) builds from
    an intimate, close-miked verse into a hypnotic pulse. The track transforms overheard
    sounds from another room into a resonant, repeating pattern. Through his detailed
    observations and shifting sonic landscapes, PCBender invites listeners to find
    their own answers on the journey.
