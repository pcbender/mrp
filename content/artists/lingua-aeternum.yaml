  promo_blurb: Lingua Aeternum operates less like a band and more like a ritual, building
    resonant songs that balance intricate arrangements with impassioned performance.
    Their work constructs its arguments brick by brick, layering interlocking guitar
    and synth melodies over punchy rhythms to land with genuine conviction. The recent
    single ["Aim For True"](/releases/aim-for-true/) captures the feeling of creative
    struggle with a driving, chest-thumping pulse and plainspoken honesty. It follows
    the more expansive ["Sentia"](/releases/sentia/), a multi-movement piece that
    guides the listener from distorted, tense passages to a final resolution of quiet,
    layered harmonies. Lingua Aeternum makes music that asks for your attention and
    fully repays the investment.
