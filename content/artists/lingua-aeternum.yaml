  bio_short: Lingua Aeternum crafts intricate, philosophical songs that chart the
    unseen landscapes of the human mind. Their lyrics grapple with paradox, the struggle
    of the creative act, and the search for an authentic self, using stark imagery
    and hypnotic repetition. It is music as a form of wayfinding, offering listeners
    a map not to a place, but to a state of being.
  bio_long: "Lingua Aeternum, the latest project on Maricopa Records, is a profound\
    \ exploration of the space between thought and sound. The work is a form of philosophical\
    \ inquiry set to music, eschewing simple narratives for a rich tapestry of metaphor\
    \ and paradox. These are songs about the very act of creation, the tension between\
    \ meaning and truth, and the winding paths of self-discovery. Lingua Aeternum's\
    \ lyrics interrogate the internal world with the precision of a cartographer,\
    \ mapping the canyons of doubt and the coastlines of resolve.\r\n\r\nAt the core\
    \ of the project’s lyrical world is a fascination with duality. As explored in\
    \ songs like \"Opposites Attach,\" life is not a series of collisions between\
    \ black and white but a constant, intricate weaving of contradictory forces: love\
    \ and hate, silence and breath, chaos and order. This same tension is present\
    \ in the persistent examination of the creative struggle, where what is broken\
    \ often \"speaks the loudest part\" and a body of work becomes the very body of\
    \ the artist. The music finds its power not in easy resolutions but in the resonant\
    \ act of aiming for what feels true, even when the hand still shakes.\r\n\r\n\
    The emotional register is as dynamic as the themes, moving from the vulnerable\
    \ confession of a \"Stone Warrior\" learning to let in the light, to the hypnotic,\
    \ meditative quality of pieces like \"Sentia\" that guide the listener toward\
    \ a state of pure awareness. The project's voice is one of stark contrasts, moving\
    \ from dense, abstract verses to direct, declarative choruses that serve as anchors\
    \ in a sea of contemplation. Concrete images, a compass that cannot settle, a\
    \ single thread waiting to be woven, a candle burning deep within, ground the\
    \ listener in a world that is deeply felt and meticulously observed.\r\n\r\nUltimately,\
    \ the music of Lingua Aeternum is an invitation to look inward, to embrace complexity,\
    \ and to find meaning not in final answers but in the dedicated act of seeking.\
    \ It is a soundtrack for the \"Wayfinder\" in everyone, for those charting their\
    \ own internal caves and canyons with a compass that has been purposefully left\
    \ behind. This is music that doesn't just describe the journey of becoming, it\
    \ serves as a companion for it."
