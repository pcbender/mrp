      \ \"Spectrum\"—a perfect blend of jazz fluidity and raw rock power.\r\n\r\n\
      Fox's playing style is relentless—a fusion of John Bonham's heaviness, Stewart\
      \ Copeland's syncopation, and Tony Williams' jazz unpredictability. Before joining\
      \ 4Castle, he was a session drummer, playing on alt-rock, jazz fusion, and even\
      \ electronic records. His ability to jump between styles effortlessly made him\
      \ the ideal backbone for a band that refuses to be confined to one genre.\r\n\
      \r\nWith 4Castle, Fox keeps the band's sound rhythmically adventurous while\
