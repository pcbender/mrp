    bio: "Raven Cortez grew up in San Juan, Puerto Rico, where the sounds of salsa,\
      \ bomba, and jazz filled the air. As a child, she was drawn to classical guitar,\
      \ but everything changed when she saw a video of Carlos Santana at Woodstock—the\
      \ fire, the soul, the raw expression of his playing. She begged for an electric\
      \ guitar and spent endless nights mimicking Santana's phrasing, Eddie Van Halen's\
      \ speed, and Prince's stage presence.\r\n\r\nAfter moving to Los Angeles as\
      \ a teenager, she carved out a name in underground rock clubs, where her intensely\
      \ melodic yet unpredictable solos made her a rising force. She briefly worked\
      \ as a session guitarist, contributing to Latin rock albums and even ghostwriting\
      \ solos for pop acts. However, Raven longed for a band where she could be fully\
      \ herself—blending her Latin roots with the progressive complexity and hard\
      \ rock fire that fueled her playing.\r\n\r\nNow, as 4Castle's lead guitarist\
      \ and one of their vocalists, she brings raw energy, intricate lead work, and\
      \ fiery charisma to the band's sound. Her stage presence is magnetic—when she\
      \ plays, you feel every note like a conversation."
