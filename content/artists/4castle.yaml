    bio: "Born and raised in Chicago, Mack Bishop grew up surrounded by music. His\
      \ father was a jazz saxophonist, and his mother played gospel organ in church.\
      \ But Mack found his true calling the day he heard Sly Stone's \"Thank You (Falettinme\
      \ Be Mice Elf Agin)\"—the slap bassline changed his life. He became obsessed\
      \ with funk grooves, mastering the slaps of Bootsy Collins, the jazz phrasing\
      \ of Jaco Pastorius, and the rock-solid presence of John Paul Jones.\r\n\r\n\
      By his early 20s, Mack had already toured with R&B and funk acts, playing everywhere\
      \ from tiny blues clubs to massive festival stages. He built a reputation as\
      \ the guy who could hold down the groove no matter how wild things got. When\
      \ 4Castle formed, Raven knew she needed a bassist who wasn't just a rhythm player—but\
      \ someone who could make the bass sing.\r\n\r\nMack is the foundation of 4Castle's\
      \ rhythm section, combining tight, funk-driven basslines with moments of soaring\
      \ melodic runs that break out unexpectedly. His deep, smooth vocals add another\
      \ layer to the band's rich harmonies."
