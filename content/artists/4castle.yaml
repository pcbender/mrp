  promo_blurb: 4Castle crafts expansive rock music built around the immense power
    of layered vocal harmony. Their recent series of singles showcases an impressive
    emotional and sonic range. On ["The Only Way Over"](/releases/the-only-way-over/),
    the band delivers a cathartic, arena-sized chorus, while ["To Be All"](/releases/to-be-all/)
    finds its lift in grounded, plain-spoken lyrics that bloom into a communal sound.
    Their latest track, ["A Good Day To Be"](/releases/a-good-day-to-be/), reveals
    a quieter side, paring the arrangement down to a delicate acoustic guitar and
    a single intimate vocal. Across these songs, 4Castle demonstrates a striking ability
    to earn its emotional peaks through patient, detailed songwriting. Dive into their
    latest work to hear a band that finds equal strength in both the roar and the
    whisper.
