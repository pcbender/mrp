  promo_blurb: Michael Anthony Rose writes unflinching songs that transform the quiet
    moments of life and loss into profoundly human statements. His music finds its
    power not in grand gestures, but in the honest details of aging, memory, and the
    search for durable truth. His recent singles showcase this range, from the driving
    rock of ["Live Forever Or Die Trying"](/releases/live-forever-or-die-trying/),
    which meditates on legacy with confident force, to the steady folk pulse of ["You
    Know Enough"](/releases/you-know-enough/), a plain-spoken confession about family
    and self-acceptance. The collection is rounded out by the warm, jazzy groove of
    ["A Distant Memory"](/releases/a-distant-memory/), a track that explores the ache
    beneath a restrained surface. This is music that holds its gaze, inviting listeners
    to feel seen in their own complex stories.
