  promo_blurb: Michael Anthony Rose chronicles the pressures of time and power, pairing
    unflinching personal songs with ambitious, novelistic narratives. His work explores
    what it means to endure when both the self and the state feel as if they are coming
    apart. This vision is on full display in his recent two-hour rock opera, [*Outlandia*](/releases/outlandia/),
    a designed descent that dissects a nation’s unraveling through a full cast of
    characters. Following that epic canvas, the single ["Them Bones"]](/releases/them-bones/)
    offers a more compressed sound, turning its nautical imagery into a superstitious
    and electric sea shanty. Across these releases, Rose examines what we build to
    outlast ourselves, inviting listeners into a vital and resonant musical world
    where every detail matters.
