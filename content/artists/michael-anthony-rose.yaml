  promo_blurb: Michael Anthony Rose is a songwriter of formidable range, shifting
    between raw personal confession and ambitious novelistic storytelling. His music
    serves as both an intimate mirror and a critical lens, confronting the mechanics
    of power and the passage of time. This dynamic is on full display in his latest
    work, the sprawling rock opera [*Outlandia*](/releases/outlandia/), which traces
    a nation’s unraveling. The album anchors its grand narrative in small, potent
    details, from the courtroom tension of "NDA" to the chilling sincerity of "Dear
    Leader." In contrast, the preceding single ["You Don't Say"](/releases/you-don-t-say/)
    builds from a single piano phrase into a cathartic, full-band chorus about unspoken
    truths. Whether exploring political machinations or personal heartbreak, Rose’s
    writing invites listeners who believe music can illuminate both the world and
    the self.
