  promo_blurb: Michael Anthony Rose writes unflinching songs about the stories we
    tell ourselves to survive. His literate songwriting chronicles the fault lines
    in both the human heart and the body politic, shifting from intimate confessionals
    to sharp, cinematic narratives on the mechanics of power. On his latest album,
    [*Wazoo In Effigy*](/releases/wazoo-in-effigy/), Rose leans into musical absurdity
    and intricate arrangements to explore everyday foolishness. Rather than simple
    imitation, the project embraces the adventurous spirit of Frank Zappa to see what
    can be built with complete creative freedom. This expansive mindset also runs
    through his recent singles. ["Unreasonably Quiet"](/releases/unreasonably-quiet/)
    delivers a dense, swelling meditation on what we hold onto and what we let slip
    away. Meanwhile, ["Them Bones"](/releases/them-bones/) offers a concentrated dose
    of nautical imagery and dark storytelling, anchoring his deep baritone inside
    an electric sea shanty. Dive into his compelling catalog and discover a fearless
    composer asking what is truly real.
