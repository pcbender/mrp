  bio_short: STAB isn’t just a name-it’s a statement. A sonic force of nature, she
    channels the electric pulse of '80s pop-rock, fusing jangly guitars, driving basslines,
    and tight harmonies into anthems that hit hard and leave a mark. Bold, confident,
    and unapologetically fierce, STAB delivers high-energy hooks with a rebellious
    edge, embracing the raw, unfiltered spirit of rock.
  bio_long: "STAB isn’t just a name-it’s a statement. A sonic force of nature, she\
    \ channels the electric pulse of '80s pop-rock, fusing jangly guitars, driving\
    \ basslines, and tight harmonies into anthems that hit hard and leave a mark.\
    \ Bold, confident, and unapologetically fierce, STAB delivers high-energy hooks\
    \ with a rebellious edge, embracing the raw, unfiltered spirit of rock.\r\n\r\n\
    Her music is a love letter to the golden age of girl bands, blending the infectious\
    \ melodies of The Bangles with the gritty attitude of The Runaways. Whether she’s\
    \ tearing through anthemic choruses, throwing down sharp riffs, or tapping into\
    \ her softer, more introspective side, STAB’s voice is unmistakable-powerful yet\
    \ effortlessly cool.\r\n\r\nA signature artist under Maricopa Records, STAB thrives\
    \ in the space where analog warmth meets AI-driven creativity, pushing boundaries\
    \ while staying true to the timeless essence of rock 'n' roll. She’s not here\
    \ to follow trends-she’s here to carve her own path, one catchy, defiant, and\
    \ undeniably addictive track at a time.\r\n\r\nIf you’re looking for music that\
    \ hits like a lightning bolt and stays in your head for days-STAB is already in\
    \ your veins."
