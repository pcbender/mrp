  promo_blurb: STAB channels the electric pulse of ‘80s pop-rock, fusing jangly guitars
    and driving basslines into anthems that are bold, confident, and unapologetically
    fierce. Her recent work showcases a formidable artistic range, moving from high-energy
    hooks to more introspective territory. The single ["Raven Dark"](/releases/raven-dark/)
    builds a creation myth with a ritualistic, call-and-response chorus that delivers
    a genuine dynamic punch. On ["June Gloom"](/releases/june-gloom/), she captures
    a restless energy, contrasting spare verses against a dense, chaotic hook to create
    a powerful emotional arc. The more controlled ["Just A Waste Of Tears"](/releases/just-a-waste-of-tears/)
    explores her reflective side, finding strength in restraint and melodic insistence.
    With a raw, unfiltered spirit at her core, STAB is an artist who hits hard and
    leaves a mark.
