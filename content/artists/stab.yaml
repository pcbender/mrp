  bio_short: STAB, the latest project from Maricopa Records, chronicles the friction
    between our inner lives and our hyper-connected world. With lyrics that swing
    from blistering social critique to quiet, confessional introspection, STAB gives
    voice to the messy, unedited moments of modern existence. It is the sound of logging
    off, facing the silence, and trying to find what remains.
  bio_long: 'STAB, a project on Maricopa Records, operates as a lyrical field guide
    to the fractured state of the modern soul. The project’s songs grapple with the
    friction between the person we are and the person we perform, whether online,
    in relationships, or in the quiet of our own minds. This is a world built from
    unflinching confessionals, sharp social satire, and moments of profound philosophical
    surrender, mapping a vast emotional and intellectual territory.


    At the heart of STAB''s work is a powerful, recurring examination of life in the
    digital age. Songs like “Excess Fiasco” deliver a cynical takedown of hustle culture
    and monetized existence, where life is a “carousel made out of steel.” The extensive
    “The Messy Middle” series offers a raw, vulnerable account of the consequences:
    the phantom phone buzz, the loss of focus, and the quiet panic of confronting
    oneself when the screens go dark. The language is direct and immediate, capturing
    the specific anxieties of being “always half here, always reaching” and the difficult,
    necessary work of reclaiming one’s own attention.


    This exploration of authenticity extends to the chaos of human connection. STAB''s
    emotional register is vast, swinging from the vengeful, scorched earth fury of
    “Tits Up (Remix)” and the desperate physicality of “Burn Me” to the resilient,
    post-heartbreak anthem “The Hardest Gift.” Yet, beyond the personal, the project
    also reaches for the universal. In tracks like “Here Comes the Rain,” the artist
    confronts fate not with fear, but with a radical acceptance, finding strength
    in surrendering to forces beyond control with the resolve to “face what falls
    and call it mine.”


    Across mythological tales, bedroom confessions, and cultural critiques, STAB maintains
    a singular focus: a search for what is true. The lyrics are both concrete and
    metaphorical, grounding abstract feelings of alienation in the familiar glow of
    a phone screen or the weight of a silent room. It is a project for anyone who
    has ever felt a disconnect between their feed and their feelings, for anyone fighting
    to hear their own voice above the noise. STAB doesn''t offer easy answers, but
    instead provides a powerful, unflinching companion for the journey.'
